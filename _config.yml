# ----------------------- Site Settings -----------------------
locale                   : "en-US"
title                    : "Knoblauch Resources"
title_separator          : "-"
subtitle                 : "Stewardship at Depth."
name                     : "Knoblauch Resources"
description              : "A Future We Share - The transition to clean energy demands materials that only the ocean can provide in sufficient quantity. Knoblauch Resources is proud to be part of that supply chain — quietly, responsibly, and with the long horizon in mind."
url                      : "https://knoblauchresources.com"
baseurl                  : ""
repository               : #"dancocos/knoblauchresources"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/teaser.png"
logo                     : "/assets/images/logo.png"
masthead_title           : "Knoblauch Resources"

# ----------------------- Theme -----------------------
remote_theme             : "mmistakes/minimal-mistakes"
minimal_mistakes_skin    : "default"   # options: default, air, aqua, contrast, dark, dirt, neon, mint, plum, sunset

# ----------------------- Build Settings -----------------------
markdown                 : kramdown
highlighter               : rouge
permalink                : /:categories/:title/
paginate                 : 6
paginate_path            : /page:num/
timezone                 : America/New_York

include:
  - _pages

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# ----------------------- Author / Company Info -----------------------
author:
  name             : "Knoblauch Resources"
  avatar           : "/assets/images/logo.png"
  bio              : "Stewardship at Depth."
  location         : "Worldwide"
