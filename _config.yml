# ----------------------- Default Layouts -----------------------
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

# ----------------------- SEO -----------------------
google_site_verification :
og_image                 : "/assets/images/logo.png"

# ----------------------- Analytics -----------------------
analytics:
  provider                : "google-gtag"
  google:
    tracking_id            : "G-JTY4SE3WC4"
    anonymize_ip           : # true, false (default)
